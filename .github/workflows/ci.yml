name: ci

# Tier C — correctness. See docs/CI_TIERS.md.
#
# NOTHING IN THIS WORKFLOW IS ADMISSIBLE AS EVIDENCE ABOUT THE docs/ARCHITECTURE.md
# §1 FLOOR, IN EITHER DIRECTION. Hosted runners have no GPU, no physical device, no
# thermal envelope, no network shaping, and noisy shared vCPUs. A green run here means
# the code compiles and is correct on the paths exercised. It does not mean the floor
# is met, and it may never be cited as though it did — docs/CONFORMANCE_PROFILES.md §5
# and docs/CI_TIERS.md §3.
#
# Measurement is Tier M and does not run here.
#
# The matrix carries one row per target family from docs/ARCHITECTURE.md §4.1, including
# rows that do not yet pass. Rows marked `dark` are expected-failing and do not fail the
# build; they exist so the matrix shape is correct from the first commit. Per AGENTS.md §4,
# "six-platform CI added late is six-platform CI that never gets added." Lighting a dark row
# is a build-graph change, not a CI restructure. Deleting one is a scope change.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the fuzz job only. Fuzzing is unbounded by nature and does not
    # belong on a per-commit gate; the deterministic randomized decode tests in the
    # `test` job cover the per-commit case.
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # docs/ARCHITECTURE.md §2 and AGENTS.md §3 require a pinned compiler. build.zig.zon's
  # `minimum_zig_version` is a floor, not a pin; this is the pin for CI.
  ZIG_VERSION: 0.16.0

jobs:
  # ---------------------------------------------------------------------------
  # Build — one row per target family in docs/ARCHITECTURE.md §4.1.
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.platform }} · ${{ matrix.status }}
    runs-on: ${{ matrix.host }}
    continue-on-error: ${{ matrix.status == 'dark' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- lit -------------------------------------------------------------
          - platform: windows
            target: x86_64-windows-gnu
            host: ubuntu-latest
            status: green

          - platform: linux
            target: x86_64-linux-gnu
            host: ubuntu-latest
            status: green

          - platform: linux-arm64
            target: aarch64-linux-gnu
            host: ubuntu-latest
            status: green

          # Zig bundles libSystem .tbd stubs, so macOS cross-links from a Linux host
          # with no Apple tooling. iOS does not — see the dark row below.
          - platform: macos
            target: aarch64-macos
            host: ubuntu-latest
            status: green

          - platform: android
            target: aarch64-linux-android
            host: ubuntu-latest
            status: green
            # Covers the Zig-only portion. GameActivity/NDK surfaces (§4.1) will need
            # the NDK on this row once the platform shim exists.

          - platform: web-wasi
            target: wasm32-wasi
            host: ubuntu-latest
            status: green
            # Not the shipping web target — WASI supplies a POSIX surface the browser
            # does not have. Kept as a second wasm configuration: it exercises the
            # libc-backed path the freestanding row deliberately cannot reach.

          - platform: web
            target: wasm32-freestanding
            host: ubuntu-latest
            status: green
            # The shipping web target (docs/CONFORMANCE_PROFILES.md §2 requires
            # Worker + OffscreenCanvas + SharedArrayBuffer). Rooted at src/web.zig with
            # no entry point — anything that reaches std.process or std.Io's OS-backed
            # paths breaks this row and nothing else. Best early warning for §18.17.

          - platform: ios
            target: aarch64-ios
            host: ubuntu-latest
            status: green
            # A static library, not an executable — an Xcode app target owns the entry
            # point (docs/ARCHITECTURE.md §2). A static archive has no link step, so this
            # needs no Apple SDK and no macOS runner: it builds from any host and is a
            # continuous check that no platform SDK type has leaked into portable code
            # (§18.9). Linking an iOS *executable* needs a --libc file, not --sysroot
            # (ziglang/zig#19217) — see docs/CI_TIERS.md §4. Packaging, signing and
            # launching are M0 criteria that no compile row can stand in for.

    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build
        run: zig build -Dtarget=${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Test — native execution only. Cross-built artifacts are not run here.
  #
  # This job is the substrate for cross-ISA determinism verification
  # (docs/ARCHITECTURE.md §7). x86_64 and aarch64 both appear natively and on more
  # than one OS, which is what `--verify-determinism` needs in order to mean anything.
  # That row is not present yet — see docs/CI_TIERS.md §4.
  # ---------------------------------------------------------------------------
  test:
    name: test ${{ matrix.target.name }} · ${{ matrix.optimize }}
    runs-on: ${{ matrix.target.host }}
    strategy:
      fail-fast: false
      # Both axes must be real axes. A bare `optimize` list plus an `include:` block
      # does NOT produce a cross product — GitHub merges each include entry into the
      # existing combinations, so the four hosts overwrite one another and only the
      # last survives. That silently collapses this job from 8 rows to 2 and still
      # reports success, which is precisely the coverage hole docs/CI_TIERS.md §4
      # says the matrix exists to prevent.
      matrix:
        optimize: [Debug, ReleaseSafe]
        target:
          - { name: windows-x86_64, host: windows-latest }
          - { name: linux-x86_64,   host: ubuntu-latest }
          - { name: linux-aarch64,  host: ubuntu-24.04-arm }
          - { name: macos-aarch64,  host: macos-latest }

    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: test
        run: zig build test -Doptimize=${{ matrix.optimize }}

  # ---------------------------------------------------------------------------
  # Schema identity. docs/SCHEMA_AND_EVOLUTION.md §10.
  #
  # Pure CPU — no GPU, no device, no network, no Apple hardware. Checks 1, 2, 3, 9
  # and 10 are @compileError, so a violation fails `zig build` rather than a test.
  # This job covers check 4 (manifest byte-identical across two runs of the same
  # commit) at the build level, where a cold cache is a real second run rather than
  # a second call in one process.
  # ---------------------------------------------------------------------------
  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: emit manifest
        run: |
          zig build schema
          cp zig-out/schema/manifest.txt /tmp/first.txt
          cat /tmp/first.txt

      - name: check 4 — byte-identical from a cold cache
        run: |
          rm -rf .zig-cache zig-out
          zig build schema
          if ! diff -u /tmp/first.txt zig-out/schema/manifest.txt; then
            echo "::error::Manifest is not deterministic for one commit (§10 check 4)."
            exit 1
          fi
          echo "manifest is byte-identical across a cold rebuild"

      - name: fingerprint is stable and recorded
        run: |
          fp=$(grep '^fingerprint ' zig-out/schema/manifest.txt | cut -d' ' -f2)
          echo "fingerprint: $fp"
          test -n "$fp" || { echo "::error::no fingerprint in manifest"; exit 1; }

  # ---------------------------------------------------------------------------
  # Fuzzing. AGENTS.md §3: "Every parser gets a fuzz target."
  #
  # `--release=safe` is REQUIRED, not a tuning choice. In Debug, Zig 0.16.0 fails to
  # build its own lib/compiler/test_runner.zig:566 (passes a *builtin.StackTrace
  # where *const debug.StackTrace is expected) — upstream, and it breaks every fuzz
  # target. ReleaseSafe is also the mode AGENTS.md §3 assigns to packet parse, so
  # this exercises the configuration that ships rather than one nobody deploys.
  #
  # Linux only: Windows reports "not yet implemented for windows" in any mode.
  # Locally that means WSL2 — docs/CI_TIERS.md §5.
  #
  # Nightly and on demand rather than per-commit: fuzzing runs until it finds
  # something or you stop it, which is not a gate shape. Per-commit coverage is the
  # deterministic generators in src/wire/property.zig, which run in the `test` job
  # on every target.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: fuzz the wire decoders
        run: |
          set +e
          timeout --signal=INT 900 zig build test --fuzz --release=safe 2>&1 | tee /tmp/fuzz.log
          code=${PIPESTATUS[0]}
          set -e
          # Guard against the upstream break silently reappearing and being read as a pass.
          if grep -q "test_runner.zig" /tmp/fuzz.log; then
            echo "::error::Fuzzer failed to build in Zig's test_runner — the upstream Debug break has reached ReleaseSafe."
            exit 1
          fi
          # 124 = timeout fired, 130 = SIGINT. Both mean the full window ran with no
          # finding, which is the pass condition. Anything else is a finding.
          if [ $code -ne 0 ] && [ $code -ne 124 ] && [ $code -ne 130 ]; then
            echo "::error::Fuzzer exited $code — reproduce with 'zig build test --fuzz --release=safe'."
            exit $code
          fi
          echo "fuzz window completed with no findings"

  # ---------------------------------------------------------------------------
  # Hygiene.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig src
